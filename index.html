<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人介绍 | 林墨</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --text: #1f2937;
      --muted: #6b7280;
      --surface: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #dbeafe, #eff6ff 45%, #e0e7ff);
    }

    .card {
      width: min(100%, 720px);
      padding: 48px;
      text-align: center;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
      backdrop-filter: blur(12px);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 42px);
    }

    .title {
      margin: 0 0 24px;
      color: var(--primary);
      font-size: 18px;
      font-weight: 600;
    }

    .intro {
      max-width: 560px;
      margin: 0 auto 32px;
      color: var(--muted);
      line-height: 1.8;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .skill {
      padding: 8px 14px;
      color: #1d4ed8;
      font-size: 14px;
      background: #dbeafe;
      border-radius: 999px;
    }

    .contact {
      display: inline-flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .contact a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-label="林墨头像">林</div>
    <h1>你好，我是林墨</h1>
    <p class="title">前端开发者 · 设计爱好者</p>

    <p class="intro">
      我是一名热爱创造的前端开发者，专注于构建简洁、实用且令人愉悦的网页体验。
      工作之余喜欢阅读、摄影，也喜欢探索新技术。
    </p>

    <div class="skills" aria-label="技能列表">
      <span class="skill">HTML / CSS</span>
      <span class="skill">JavaScript</span>
      <span class="skill">响应式设计</span>
      <span class="skill">用户体验</span>
    </div>

    <nav class="contact" aria-label="联系方式">
      <a href="mailto:hello@example.com">邮箱</a>
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="#about">了解更多</a>
    </nav>
  </main>
</body>
</html>
